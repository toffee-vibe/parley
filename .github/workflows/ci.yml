# Проверка на трёх системах: зависимости ставятся, тесты проходят, окно собирается без экрана,
# PortAudio (звук на Windows/macOS) загружается. Снимки окна — в артефактах сборки.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7

      - name: Библиотеки для Qt без экрана (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - run: uv sync
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q

      - name: Звук через PortAudio загружается
        if: runner.os != 'Linux'  # на Linux в CI нет звукового сервера; там звук через PipeWire
        run: uv run python -c "import sounddevice as sd; print(sd.get_portaudio_version())"

      - name: parley doctor
        run: uv run parley doctor

      - name: Окно собирается (без экрана, программная отрисовка)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: uv run python scripts/screenshots.py screenshots

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: screenshots/
          if-no-files-found: ignore
