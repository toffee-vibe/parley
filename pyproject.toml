[project]
name = "parley"
version = "0.1.0"
description = "Голосовой компаньон для практики английского: Claude слышит тебя и отвечает вслух"
readme = "README.md"
authors = [
    { name = "toffee-vibe" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.5",
    "pyside6>=6.12.0",
    "sherpa-onnx>=1.12,<2",
    "sherpa-onnx-core==1.13.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
parley = "parley:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/parley/domain", "src/parley/application"]
ignore_missing_imports = true
check_untyped_defs = true
